<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Food Roguelike</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
            background: rgba(0, 0, 0, 0.95);
            font-family: 'Arial', sans-serif;
        }

        #game-ui.active {
            display: flex;
            pointer-events: all;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .screen h1 {
            font-size: 36px;
            color: #FFD700;
            margin-bottom: 20px;
            text-align: center;
        }

        .screen p {
            font-size: 20px;
            margin: 10px 0;
        }

        .button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.2s;
            min-width: 200px;
        }

        .button:hover {
            background: #66BB6A;
        }

        .button:active {
            background: #2E7D32;
        }

        .button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .card {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 10px;
            min-width: 450px;
            max-width: 600px;
        }

        .card.max-level {
            border-color: #FFD700;
        }

        .card h3 {
            color: #FFF;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .card.max-level h3 {
            color: #FFD700;
        }

        .card p {
            color: #AAA;
            font-size: 14px;
            margin: 5px 0;
        }

        .card .effect {
            color: #90EE90;
            font-size: 14px;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }

        .flex-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .max-badge {
            color: #FFD700;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="game-ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
